<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1018">
<title>Паркет — тренерская доска</title>
<style>
@font-face{font-family:ParketDisplay;src:local("Impact");font-weight:900;font-display:swap}
:root{color-scheme:dark;--bg:#0c1018;--panel:#161d28;--line:#313946;--muted:#a3adbd;--orange:#ff823d;--ink:#f5f6fa;font:16px/1.45 "Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);min-height:100vh;min-height:100svh;display:flex;flex-direction:column}
button,input,select{font:inherit}button{cursor:pointer;color:inherit}button:disabled{opacity:.38;cursor:default}
button,input,select{outline-offset:4px}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #ffad71}
button{border:0;background:none}button,.control,.primary{transition:background .18s,border-color .18s,transform .18s}
button:active:not(:disabled){transform:translateY(1px)}[hidden]{display:none!important}
.icon{width:20px;height:20px;display:inline-block;vertical-align:middle;flex:none;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
.top{height:77px;flex:none;border-bottom:1px solid #252c37;background:#0e131c;display:flex;align-items:center;padding:0 clamp(20px,5vw,84px);gap:21px}
.brand{display:flex;align-items:center;gap:10px}.brand .icon{width:38px;height:38px;color:var(--orange);stroke-width:1.5}
.brand strong,.poster h1,.board-title{font-family:ParketDisplay,"Arial Narrow",sans-serif;font-weight:900;font-stretch:condensed}
.brand strong{font-size:27px;letter-spacing:1.2px;font-style:italic}.brand-sub{border-left:1px solid var(--line);padding-left:21px;color:#a4adbc;font-size:14px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:16px}.school{display:flex;align-items:center;gap:9px;color:#c2cad6;font-size:14px}.school .icon{width:17px;color:var(--muted)}
.login-area{flex:1;display:grid;place-items:center;padding:clamp(36px,6vh,80px) clamp(16px,4vw,70px);background-image:radial-gradient(ellipse at 25% 49%,#1a294044,transparent 63%),linear-gradient(#a2b8e004 1px,transparent 1px),linear-gradient(90deg,#a2b8e004 1px,transparent 1px);background-size:auto,48px 48px,48px 48px}
.login-card{width:min(100%,1112px);display:grid;grid-template-columns:1.13fr 1fr;border:1px solid #36404e;background:var(--panel);border-radius:19px;overflow:hidden;box-shadow:0 30px 90px #0005}
.poster{position:relative;isolation:isolate;background:#123a9c var(--poster) center center/cover no-repeat;min-width:0;min-height:540px;padding:clamp(26px,3.3vw,48px);display:flex;flex-direction:column}
.poster:before{content:"";inset:0;position:absolute;z-index:-1;background:linear-gradient(0deg,#07153f99,transparent 17%,transparent 66%,#10205033)}
.poster-meta{display:flex;align-items:center;justify-content:space-between;color:#f5f7ff}.tagline{font:700 11px/1.5 "Courier New",monospace;letter-spacing:2px;display:flex;align-items:center;gap:10px}.tagline:before{content:"";width:26px;height:3px;background:var(--orange)}
.slashes{display:inline-block;width:38px;height:16px;transform:skew(-22deg);background:repeating-linear-gradient(90deg,var(--orange) 0 7px,transparent 7px 12px)}
.poster h1{margin:25px 0 0;font-size:clamp(55px,5.7vw,82px);line-height:.99;letter-spacing:-.025em;text-transform:uppercase;font-style:italic;transform:scaleX(.9);transform-origin:left;width:111%;text-shadow:0 3px 12px #09154338}
.poster h1 span{display:block;color:#ff9950}.formats{margin-top:auto;display:flex;gap:8px;padding-top:28px}.format{font:700 13px/1 "Courier New",monospace;letter-spacing:1px;padding:8px 10px;border:1px solid #c4d4f98a;background:#0d245799;border-radius:5px}
.login-side{display:flex;flex-direction:column;justify-content:center;padding:44px clamp(26px,3.45vw,53px);background:linear-gradient(135deg,#19212d,#151b26 85%)}
.login-emblem{display:grid;place-items:center;width:45px;height:45px;border-radius:12px;border:1px solid #f796563d;background:#f5853620;color:var(--orange);margin-bottom:19px}.login-emblem .icon{width:24px;height:24px}
h2,h3,p{margin:0}.login-side h2{font-size:clamp(30px,2.7vw,40px);letter-spacing:-.05em;line-height:1.13}.intro{color:var(--muted);font-size:15px;margin:9px 0 26px}
.field{display:block;font-size:14px;font-weight:600;margin-bottom:8px}.inputbox{display:flex;align-items:center;width:100%;border:1px solid #374150;background:#101620;border-radius:8px;min-height:48px;color:#8e99ab;padding-left:14px;gap:11px}.inputbox:focus-within{border-color:var(--orange);box-shadow:0 0 0 3px #ff853018}.inputbox .icon{width:18px}
.inputbox input,dialog input{background:transparent;border:none;min-width:0;color:var(--ink);width:100%;padding:13px 10px 13px 0;outline:0;font-size:15px}
input::placeholder{color:#8490a2}.inputbox+.field{margin-top:18px}.eye{align-self:stretch;padding:0 13px;color:#95a2b5}.eye:hover{color:white}
.remember{display:flex;align-items:center;gap:10px;color:#c0c8d4;cursor:pointer;font-size:14px;width:fit-content;margin:20px 0 22px}.remember input{accent-color:var(--orange);width:17px;height:17px;margin:0}
.primary,.control,.icon-btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border-radius:8px;font-weight:650}
.primary{background:var(--orange);color:#201409;padding:12px 18px;border:1px solid #ffa26555}.primary:hover:not(:disabled){background:#ff985d}.login-submit{width:100%;height:48px}.login-submit .icon{width:18px}
.notice{font-size:14px;color:#ff9999;margin:0 0 12px}.notice:empty{display:none}.shake{animation:shake .32s ease-in-out}@keyframes shake{25%,75%{transform:translateX(-5px)}50%{transform:translateX(5px)}}
.page-foot{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px clamp(20px,5vw,84px);border-top:1px solid #252c37;color:#929eaf;font-size:13px}.foot-note,.help{display:flex;align-items:center;gap:8px}.page-foot .icon{width:16px;height:16px}.help{font-size:13px;color:#bdc6d4;padding:7px 0}.help:hover{color:white}
.control,.icon-btn{min-height:39px;background:#202836;border:1px solid #374252;padding:8px 13px;font-size:14px}.icon-btn{width:40px;padding:8px}.control:hover:not(:disabled),.icon-btn:hover:not(:disabled){background:#303c4d}.control .icon,.icon-btn .icon{width:17px;height:17px}
#workspace{width:min(1540px,100%);margin:auto;padding:28px clamp(14px,3vw,48px);flex:1}.board-heading,.board-actions,.section-label,.segments,.palette,.history,.board-foot,.dialog-head,.dialog-actions,.library-row,.board-meta{display:flex;align-items:center}.board-heading,.dialog-head,.board-foot,.library-row{justify-content:space-between;gap:12px}.board-heading{margin-bottom:21px;flex-wrap:wrap}.board-title{font-size:clamp(31px,3.4vw,49px);line-height:1.1;text-transform:uppercase;letter-spacing:.1px;font-style:italic}.board-actions{gap:8px;flex-wrap:wrap}.board-actions .primary{font-size:14px;padding:9px 14px}
.work-grid{display:grid;grid-template-columns:minmax(0,1fr) 222px;gap:14px;align-items:start}.panel{border:1px solid #303947;background:#151c27;border-radius:13px}.court-panel{overflow:hidden}.board-meta{padding:13px;gap:12px;flex-wrap:wrap;background:#1a2230}.segments{gap:3px;background:#10151e;padding:3px;border-radius:7px}.segments button{border-radius:5px;padding:7px 10px;color:var(--muted);font-size:13px;font-weight:600}.segments button[aria-pressed=true]{color:#fff;background:#364354;box-shadow:0 1px 4px #0005}
.board-meta .expand{margin-left:auto}.stage{padding:clamp(9px,1.3vw,18px);background:radial-gradient(#283343,#151c27);display:grid;place-items:center}.court{border:5px solid #e77b38;border-radius:9px;overflow:hidden;position:relative;width:100%;aspect-ratio:960/528;box-shadow:0 5px 16px #0006;box-sizing:content-box;max-width:calc(100% - 10px);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.court.half{width:min(100%,max(320px,56vh));aspect-ratio:528/500}.court canvas{width:100%;height:100%;position:absolute;inset:0;display:block}.court #ink{touch-action:none;cursor:crosshair}.board-foot{padding:10px 14px;border-top:1px solid #303947;flex-wrap:wrap}.legends{display:flex;gap:14px;color:#bfc8d6;font-size:13px}.legends span{display:flex;gap:6px;align-items:center}.dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.tools{padding:16px}.tools h3,.dialog-head h2{font-size:18px;letter-spacing:-.03em}.tool-list{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:12px 0 17px}.tool{min-height:47px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:#1c2532;border:1px solid #323c49;border-radius:6px;font-size:12px;color:#c9d2dd}.tool .icon{width:18px;height:18px}.tool:hover{background:#283445}.tool[aria-pressed=true]{border-color:#f48a45;background:#3a2c26;color:#ffa15f}.small-label{font-size:13px;color:#b7c2d0;font-weight:600}.palette{gap:7px;margin:8px 0 12px;flex-wrap:wrap}.swatch{background:var(--c);width:22px;height:22px;border:1px solid #ffffff52;border-radius:50%;padding:0;box-shadow:0 0 0 2px transparent}.swatch[aria-pressed=true]{box-shadow:0 0 0 2px #151c27,0 0 0 4px var(--orange)}.width-row{display:flex;align-items:center;justify-content:space-between;gap:8px}.width-row select{background:#222c3a;border:1px solid #394554;border-radius:6px;padding:6px;color:white;font-size:14px}.history{border-top:1px solid #323b48;padding-top:14px;margin-top:14px;gap:7px}.history .icon-btn{flex:1}.tools .clear{width:100%;margin-top:7px;font-size:13px}
dialog{width:min(440px,calc(100% - 28px));max-height:85svh;overflow:auto;border-radius:14px;border:1px solid #435064;padding:23px;color:var(--ink);background:#1a2230;box-shadow:0 30px 100px #0009}dialog::backdrop{background:#070b13c9;backdrop-filter:blur(4px)}.dialog-head{margin-bottom:20px}.dialog-head h2{font-size:23px}.dialog-head .icon-btn{width:33px;min-height:33px}.dialog-actions{justify-content:flex-end;margin-top:20px;gap:8px}dialog input{background:#111823;border:1px solid #455165;border-radius:7px;padding:12px}dialog p{color:#c2ccdb;font-size:15px}dialog p+p{margin-top:12px}.library-row{padding:11px 0;border-bottom:1px solid #354050}.library-name{flex:1;min-width:0;text-align:left;overflow-wrap:anywhere;padding:6px 0}.library-name small{display:block;color:#a1adbd}.toast{position:fixed;z-index:5;bottom:20px;left:50%;transform:translateX(-50%);max-width:92vw;background:#25364a;border:1px solid #4b617a;padding:10px 18px;border-radius:8px;font-size:14px;box-shadow:0 4px 20px #0006;pointer-events:none}.toast:empty{display:none}
body.wide-mode .top,body.wide-mode .page-foot{display:none}body.wide-mode #workspace{max-width:none;padding:12px}html:fullscreen{overflow:auto;background:var(--bg)}
@media(min-width:1600px){.login-card{width:1200px}.poster{min-height:610px}}
@media(max-width:1000px){.work-grid{grid-template-columns:1fr}.tools{display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:center}.tools h3,.tool-list{grid-column:1/-1}.tool-list{grid-template-columns:repeat(10,1fr);margin:0 0 8px}.palette{margin:7px 0}.history{border:0;margin:0;padding:0}.tools .clear{margin:0}.width-row{grid-column:2;grid-row:3}.colors{grid-column:1;grid-row:3}.width-row select{min-height:38px}}
@media(max-width:720px){.top{height:63px;gap:12px}.brand{gap:7px}.brand strong{font-size:23px}.brand .icon{width:31px;height:31px}.brand-sub{padding-left:12px;font-size:12px}.school{font-size:12px}.top-right{gap:6px}.login-area{padding:24px 16px}.login-card{width:min(100%,480px);grid-template-columns:1fr;border-radius:14px}.poster{min-height:180px;padding:20px 24px;background-size:100%;background-position:center 55%}.poster:before{background:linear-gradient(90deg,#00175370,transparent 74%)}.poster h1{font-size:43px;margin:13px 0 0;line-height:1}.tagline{font-size:10px}.slashes{width:25px;height:12px}.formats{position:absolute;bottom:15px;right:15px;padding:0}.format{font-size:10px;padding:5px}.login-side{padding:24px}.login-emblem{display:none}.login-side h2{font-size:30px}.intro{margin:6px 0 20px}.page-foot{padding:12px 16px}.tool-list{grid-template-columns:repeat(5,1fr)}.board-meta{gap:7px;padding:8px}.segments button{font-size:12px;padding:8px}.board-foot{padding:8px}.board-foot .control{font-size:12px}.school .icon{display:none}.board-heading{margin-bottom:12px}.board-actions{gap:5px}.board-actions .control,.board-actions .primary{padding:8px;font-size:12px}.board-actions .icon{width:15px}.court{border-width:3px;max-width:calc(100% - 6px)}.tools{padding:12px}.tool{min-height:43px}.top:has(#logout:not([hidden])) .school{display:none}}
@media(max-width:420px){.brand-sub{display:none}.poster{min-height:153px}.poster h1{font-size:39px}.page-foot{font-size:11px}.help{font-size:12px}.board-meta .expand{width:32px;min-height:33px}.board-meta{column-gap:4px}.segments button{padding:6px}.board-foot{gap:6px}.legends{gap:8px}.tool-list{gap:4px}.tools{column-gap:8px}.board-actions{width:100%}.board-actions button{flex:auto}}
button,select,.remember{touch-action:manipulation}
@media(max-width:550px){.tool-list{grid-template-columns:repeat(5,minmax(0,1fr))}.tool{min-width:0;padding:3px 1px}.tools{grid-template-columns:minmax(0,1fr) auto}.history{min-width:0}}
@media(max-width:365px){.tool-list{grid-template-columns:repeat(4,minmax(0,1fr))}.width-row{flex-direction:column;align-items:flex-start}.board-title{font-size:29px}.legends{font-size:12px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<header class="top"><div class="brand"><i data-icon="ball"></i><strong>ПАРКЕТ</strong></div><span class="brand-sub">Тренерская доска</span><div class="top-right"><span class="school"><i data-icon="school"></i>Школа №11</span><button hidden id="logout" class="control"><i data-icon="logout"></i>Выйти</button></div></header>
<main id="loginArea" class="login-area">
 <div class="login-card">
  <section class="poster" aria-label="Тактическая доска для баскетбола">
   <div class="poster-meta"><span class="tagline">БАСКЕТБОЛ</span><span class="slashes" aria-hidden="true"></span></div>

   <div class="formats"><span class="format">3 × 3</span><span class="format">5 × 5</span></div>
  </section>
  <section class="login-side">
   <span class="login-emblem"><i data-icon="court"></i></span><h2>Вход тренера</h2><p class="intro">Войдите, чтобы открыть тактическую доску.</p>
   <form id="loginForm"><label class="field" for="username">Логин</label><div class="inputbox"><i data-icon="user"></i><input id="username" name="username" autocomplete="username" placeholder="Введите логин" required autocapitalize="none" spellcheck="false"></div>
   <label class="field" for="password">Пароль</label><div class="inputbox"><i data-icon="lock"></i><input id="password" type="password" name="password" autocomplete="current-password" placeholder="Введите пароль" required><button type="button" class="eye" id="eye" aria-label="Показать пароль" aria-pressed="false"><i data-icon="eye"></i></button></div>
   <label class="remember"><input type="checkbox" id="remember">Запомнить меня</label>
   <p id="loginError" role="alert" class="notice"></p><button class="primary login-submit" id="enter" type="submit"><i data-icon="login"></i>Войти на доску</button></form>
  </section>
 </div>
</main>
<footer class="page-foot"><span class="foot-note"><i data-icon="device"></i>Данные хранятся на этом устройстве</span><button class="help" id="help"><i data-icon="book"></i>Руководство</button></footer>

<script>
'use strict';

// Элементы интерфейса и встроенные пиктограммы.
const $ = id => document.getElementById(id);
const paths = {
  ball: '<circle cx="12" cy="12" r="9.7"/><path d="M3 8.1c6.8 3 12.5 8.1 15.4 11.4M5.4 19c5-3.3 10.2-9 13.4-13.7M10.1 2.6c.2 4.6-2.5 9-7.7 10.7M21.6 10.6c-5.5 1.7-8 5.3-7.9 10.8"/>',

  user: '<circle cx="12" cy="8" r="3.5"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/>',
  lock: '<rect x="4.5" y="10" width="15" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/>',
  eye: '<path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/>',
  hide: '<path d="m3 3 18 18M9 6c5-2 10 2 13 6l-3 4M6 7l-4 5s6 9 14 6"/>',
  login: '<path d="M14 4h5v16h-5M3 12h12m-5-5 5 5-5 5"/>',
  logout: '<path d="M10 4H4v16h6m-1-8h12m-5-5 5 5-5 5"/>',

  book: '<path d="M3 4q5-1 9 2 4-3 9-2v15q-5-1-9 2-4-3-9-2zM12 6v15"/>',
  save: '<path d="M3 3h15l3 3v15H3zM7 3v6h9V3M7 21v-8h10v8"/>',
  image: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8" cy="8" r="1.5"/><path d="m3 18 5-5 3 3 5-7 5 7"/>',

  move: '<path d="M12 2v20M2 12h20M8 6l4-4 4 4M8 18l4 4 4-4M6 8l-4 4 4 4m12-8 4 4-4 4"/>',
  pen: '<path d="m4 16-1 5 5-1L21 7l-4-4zM14 6l4 4"/>',
  run: '<path d="m3 19 17-15m-8 0h8v8"/>',
  dribble: '<path d="M2 19q2-11 6-5t6-4 7-5m-6-1h6v6"/>',
  pass: '<path d="m3 20 2-2m2-2 3-3m3-3 7-6m-7 0h7v7"/>',
  screen: '<path d="M4 20 17 7m-5-5 10 10"/>',
  line: '<path d="m3 20 18-16"/>',
  oval: '<ellipse cx="12" cy="12" rx="10" ry="7"/>',
  text: '<path d="M4 7V4h16v3M12 4v16m-4 0h8"/>',
  erase: '<path d="m3 14 10-11 8 7-10 11H9zM7 10l8 7m-4 4h10"/>',

  redo: '<path d="m16 4 5 5-5 5m4-5h-9a7 7 0 0 0 0 14" transform="translate(0 -2)"/>',

};
function icon(name) {
  return '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">' + paths[name] + '</svg>';
}
document.querySelectorAll('[data-icon]').forEach(el => el.outerHTML = icon(el.dataset.icon));
function alertUser(message) {
  $('toast').textContent = message;
  clearTimeout(alertUser.timer);
  alertUser.timer = setTimeout(() => $('toast').textContent = '', 3200);
}
function openDialog(title) {
  $('modalTitle').textContent = title;
  $('modalBody').replaceChildren();
  if (!$('modal').open) $('modal').showModal();
  return $('modalBody');
}
$('closeDialog').onclick = () => $('modal').close();
$('help').onclick = () => {
  openDialog('Руководство').innerHTML = '<p>Войдите с логином и паролем тренера. «Запомнить меня» сохраняет вход в этом браузере.</p><p>Выберите площадку и состав. Перетаскивайте игроков и мяч пальцем или мышью. Чтобы нарисовать линию, начните движение на свободном месте.</p><p>Клавиши 1–9 выбирают инструменты от маркера до ластика. Ctrl+Z отменяет действие, Ctrl+Y возвращает его.</p><p>Сохраните комбинацию под своим названием. Она появится в библиотеке этого браузера. Для отправки схемы используйте экспорт PNG.</p>';
};
function askText(title, label, initial, action, callback) {
  const body = openDialog(title);
  body.innerHTML = '<form><label class="field" for="dialogInput"></label><input id="dialogInput" required maxlength="80"><div class="dialog-actions"><button class="control" type="button">Отмена</button><button class="primary" type="submit"></button></div></form>';
  body.querySelector('label').textContent = label;
  const input = $('dialogInput');
  input.value = initial;
  body.querySelector('.control').onclick = () => $('modal').close();
  body.querySelector('.primary').textContent = action;
  body.querySelector('form').onsubmit = e => {
    e.preventDefault();
    const value = input.value.trim();
    if (!value) {
      input.focus();
      return;
    }
    if (callback(value) !== false) $('modal').close();
  };
  input.focus();
  input.select();
}
// Авторизация. При смене реквизитов обновите LOGIN и PASSWORD_HASH.
const LOGIN = 'school11';
const PASSWORD_HASH = 'f960354918f8e24aedcef3fe373a4169c7dbd3776ca831ee365d91639a70ef8d';
const normalizePassword = value => value.normalize('NFKC').toLowerCase().replaceAll('а', 'a');
async function sha256(value) {
  const bytes = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(value));
  return Array.from(new Uint8Array(bytes), b => b.toString(16).padStart(2, '0')).join('');
}
const prefix = 'parket.v1.',
  authStamp = LOGIN + '@' + PASSWORD_HASH;
function readStore(key, fallback, session = false) {
  try {
    return JSON.parse((session ? sessionStorage : localStorage).getItem(prefix + key)) ?? fallback;
  } catch {
    return fallback;
  }
}
function writeStore(key, value, session = false) {
  try {
    const s = session ? sessionStorage : localStorage;
    if (value === null) s.removeItem(prefix + key);else s.setItem(prefix + key, JSON.stringify(value));
    return true;
  } catch {
    return false;
  }
}
let gate = readStore('gate', {
    tries: 0,
    until: 0
  }),
  sending = false,
  authorized = false;
function lockStatus() {
  if (authorized) return;
  const left = Math.ceil((gate.until - Date.now()) / 1000);
  if (left > 0) {
    $('enter').disabled = true;
    $('loginError').textContent = 'Неверный логин или пароль. Повторите через ' + left + ' с.';
  } else {
    if (gate.until) {
      gate = {
        tries: 0,
        until: 0
      };
      writeStore('gate', gate);
      $('loginError').textContent = '';
    }
    $('enter').disabled = sending;

}
function startPointer(e) {

    askText('Подпись на площадке', 'Текст подписи', '', 'Добавить', text => change(() => {
      const ctx = $('ink').getContext('2d'),
        m = {
          kind: 'text',
          points: [pos],
          color,
          width: thickness,
          text
        };
      ctx.font = textStyle(m);
      pos[0] = Math.max(2, Math.min(pos[0], size()[0] - ctx.measureText(text).width - 2));
      pos[1] = Math.min(pos[1], size()[1] - 18 - thickness * 2);
      view().marks.push(m);
    }));

  }

    id: e.pointerId,
    before: snapshot(),
    piece,
    start: pos,
    offset: piece ? [piece.x * size()[0] - pos[0], piece.y * size()[1] - pos[1]] : null

      color,
      width: thickness,

}
function updatePointer(e) {

      r = pieceRadius(p);

    p.y = Math.max(r, Math.min(h - r, pos[1] + gesture.offset[1])) / h;

function cancelPointer(e) {

document.addEventListener('keydown', e => {
  if (!authorized || gesture || $('modal').open || e.target.closest('input,textarea,select,[contenteditable]')) return;

    e.preventDefault();

  } else if (!e.altKey && !e.ctrlKey && !e.metaKey && /^[1-9]$/.test(e.key)) {

});
function setWide(on) {

    const label = on ? 'Выйти из полноэкранного режима' : 'На весь экран';
    $('expand').title = label;
    $('expand').setAttribute('aria-label', label);
    $('expand').innerHTML = icon(on ? 'close' : 'expand');
  }
  if (authorized) scheduleCanvas();
}
async function toggleWide() {
  if (document.body.classList.contains('wide-mode')) {
    if (document.fullscreenElement) await document.exitFullscreen();
    setWide(false);
  } else {
    try {
      await document.documentElement.requestFullscreen();
    } catch {/* На мобильном устройстве разворачиваем рабочую область внутри вкладки. */}

document.addEventListener('fullscreenchange', () => setWide(!!document.fullscreenElement));
// Хранилище комбинаций. Названия и подписи выводятся как обычный текст.
function library() {
  const records = readStore('plays', []);
  return Array.isArray(records) ? records : [];
}
function savePlay() {
  askText('Сохранить комбинацию', 'Название комбинации', currentName, 'Сохранить', name => {
    const records = library();
    records.unshift({
      id: crypto.randomUUID(),
      name,
      time: Date.now(),
      data: JSON.parse(snapshot())
    });
    if (!writeStore('plays', records)) {
      alertUser('Не удалось сохранить. Проверьте свободное место в браузере.');
      return false;
    }
    currentName = name;
    alertUser('Комбинация сохранена');
  });
}
function validModel(m) {
  const finite = n => typeof n === 'number' && Number.isFinite(n);
  return !!m && ['full', 'half'].includes(m.mode) && ['full', 'half'].every(mode => {
    const v = m[mode];
    return v && [3, 5].includes(v.count) && Array.isArray(v.pieces) && v.pieces.length === v.count * 2 + 1 && v.pieces.every(p => p && ['attack', 'defense', 'ball'].includes(p.team) && finite(p.x) && finite(p.y) && Number.isInteger(p.n)) && Array.isArray(v.marks) && v.marks.every(s => s && toolDefs.slice(1, -1).some(([key]) => key === s.kind) && colors.some(([hex]) => hex === s.color) && [2, 4, 7, 10].includes(s.width) && Array.isArray(s.points) && s.points.length >= (['pen', 'text'].includes(s.kind) ? 1 : 2) && s.points.every(a => Array.isArray(a) && a.length === 2 && a.every(finite)) && (s.kind !== 'text' || typeof s.text === 'string'));
  });
}
function showLibrary() {
  const body = openDialog('Сохранённые комбинации'),
    records = library();
  if (!records.length) {
    body.innerHTML = '<p>Пока нет комбинаций. Сохраните схему с площадки, и она появится здесь.</p>';
    return;
  }
  for (const item of records) {
    if (!item || typeof item.name !== 'string') continue;
    const row = document.createElement('div'),
      load = document.createElement('button'),
      date = document.createElement('small'),
      del = document.createElement('button');
    row.className = 'library-row';
    load.className = 'library-name';
    load.textContent = item.name;
    date.textContent = new Date(item.time).toLocaleString('ru-RU');
    load.append(date);
    load.title = 'Загрузить комбинацию';
    load.onclick = () => {
      if (!validModel(item.data)) {
        alertUser('Не удалось прочитать эту комбинацию');
        return;
      }
      change(() => model = item.data);
      currentName = item.name;
      $('modal').close();
      alertUser('Комбинация загружена');
    };
    del.className = 'icon-btn';
    del.setAttribute('aria-label', 'Удалить «' + item.name + '»');
    del.innerHTML = icon('trash');
    del.onclick = () => {
      const body = openDialog('Удалить комбинацию?'),
        p = document.createElement('p');
      p.textContent = '«' + item.name + '» будет удалена из библиотеки.';
      body.append(p);
      const actions = document.createElement('div');
      actions.className = 'dialog-actions';
      actions.innerHTML = '<button class="control">Отмена</button><button class="primary">Удалить</button>';
      body.append(actions);
      actions.firstChild.onclick = showLibrary;
      actions.lastChild.onclick = () => {
        if (writeStore('plays', library().filter(r => r.id !== item.id))) {
          showLibrary();
          alertUser('Комбинация удалена');
        } else alertUser('Не удалось удалить комбинацию');
      };
    };
    row.append(load, del);
    body.append(row);
  }
}
function exportPNG() {
  const [w, h] = size(),
    factor = 3,
    frame = 6;
  const canvas = document.createElement('canvas');
  canvas.width = (w + 2 * frame) * factor;
  canvas.height = (h + 2 * frame) * factor;
  const c = canvas.getContext('2d');
  c.scale(factor, factor);
  c.fillStyle = '#e77b38';
  c.fillRect(0, 0, w + frame * 2, h + frame * 2);
  c.translate(frame, frame);
  c.beginPath();
  c.rect(0, 0, w, h);
  c.clip();
  paintFloor(c);
  view().marks.forEach(m => paintMark(c, m));
  view().pieces.forEach(p => paintPiece(c, p));

    if (!blob) {
      alertUser('Не удалось создать изображение');
      return;
    }
    const url = URL.createObjectURL(blob),
      a = document.createElement('a');
    a.href = url;
    a.download = (currentName || 'Паркет — схема').replace(/[<>:"/\\|?*]/g, '-') + '.png';
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    alertUser('PNG готов к сохранению');
  }, 'image/png');
}
